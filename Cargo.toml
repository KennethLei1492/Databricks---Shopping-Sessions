[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = { version = "0.1.52", default-features = false }

[features]
# SS_REPLICATE: parse the input several times over with shifted IDs, to measure at the practice
# set's scale from the dev set (scripts/scale_bench.sh). Off in the submitted build.
scale = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
