[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
